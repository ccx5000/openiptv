name: open_iptv
description: >-
  Cross-platform IPTV player (Android / Android TV, iOS, macOS Intel & Apple
  Silicon) inspired by SwiptV and UHF: Xtream Codes + M3U playlists, XMLTV EPG,
  multi-user profiles and cross-device sync via Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Player (Android, iOS, macOS incl. Intel via libmpv/FFmpeg)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Backend / sync
  supabase_flutter: ^2.5.0

  # Networking & parsing
  http: ^1.2.0
  xml: ^6.5.0

  # Local persistence
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Storage & misc
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  wakelock_plus: ^1.2.8
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
