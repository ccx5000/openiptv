name: Build Releases (APK / IPA / DMG)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android / Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform project (if missing)
        run: |
          flutter create --platforms=android --org dev.openiptv --project-name open_iptv .
      - name: Deps + codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Build universal APK (Phone + Android TV)
        run: flutter build apk --release
      - name: Build split APKs (arm64 / armv7)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIPTV-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk

  macos:
    name: macOS App + DMG (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform project (if missing)
        run: |
          flutter create --platforms=macos --org dev.openiptv --project-name open_iptv .
      - name: Allow outgoing network (App Sandbox) for IPTV streams
        run: |
          EB=macos/Runner/DebugProfile.entitlements
          REL=macos/Runner/Release.entitlements
          for f in "$EB" "$REL"; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.server bool true" "$f" 2>/dev/null || true
          done
      - name: Deps + codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Build macOS app
        run: flutter build macos --release
      - name: Zip .app
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" OpenIPTV-macOS.zip
      - name: Create DMG
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          hdiutil create -volname "OpenIPTV" \
            -srcfolder "$APP" -ov -format UDZO OpenIPTV-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIPTV-macos
          path: |
            OpenIPTV-macOS.dmg
            OpenIPTV-macOS.zip

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform project (if missing)
        run: |
          flutter create --platforms=ios --org dev.openiptv --project-name open_iptv .
      - name: Deps + codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA from archive (fallback)
        run: |
          if [ -d build/ios/archive ] && ! compgen -G "build/ios/ipa/*.ipa" > /dev/null; then
            APP=$(find build/ios/archive -type d -name "*.app" | head -1)
            if [ -z "$APP" ]; then
              APP=$(find build/ios/iphoneos -type d -name "*.app" | head -1)
            fi
            if [ -n "$APP" ]; then
              mkdir -p Payload
              cp -R "$APP" Payload/
              zip -r OpenIPTV-ios-unsigned.ipa Payload
            else
              echo "No .app found in archive"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIPTV-ios-ipa
          path: |
            build/ios/ipa/*.ipa
            OpenIPTV-ios-unsigned.ipa
          if-no-files-found: warn

  release:
    name: Attach artifacts to GitHub Release (on tag)
    needs: [android, macos, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
